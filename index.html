h1,h2{font-family:Lalezar,Cairo,sans-serif;font-weight:400;margin:0}
.hero{text-align:center;padding:28px 16px 12px}
.hero img{width:150px;height:auto;border-radius:50%;mask-image:radial-gradient(circle,#000 62%,transparent 71%);-webkit-mask-image:radial-gradient(circle,#000 62%,transparent 71%)}
.hero h1{font-size:clamp(40px,10vw,68px);color:var(--org);line-height:1.1}
.hero p{margin:6px 0 16px;font-size:18px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta a{background:var(--org);color:var(--ink);font-weight:700;text-decoration:none;padding:10px 20px;border-radius:999px}
.cta a.alt{background:transparent;color:var(--cream);border:2px solid var(--org)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--deep);border-bottom:2px solid var(--org);scrollbar-width:none}
nav a{flex:none;color:var(--cream);text-decoration:none;font-weight:700;font-size:15px;padding:4px 14px;border-radius:999px;border:1px solid #ffffff55}
nav a:hover,nav a:focus-visible{background:var(--org);color:var(--ink);outline:none}
main{max-width:860px;margin:0 auto;padding:8px 14px 40px}
section{margin-top:30px}
section h2{display:inline-block;background:var(--org);color:var(--ink);font-size:30px;padding:0 22px;border-radius:6px 22px 6px 22px;transform:rotate(-1deg)}
.note{font-size:14px;opacity:.85;margin:8px 0 0}
.box{margin-top:12px;background:#00000040;border:2px solid var(--org);border-radius:18px;padding:4px 16px}
.it{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #ffffff30}
.it:last-child{border:0}
.it b{display:block;font-size:17px}
.it small{display:block;font-size:14px;opacity:.85;line-height:1.5}
.pr{display:flex;gap:6px;flex:none}
.pr span{background:#fff;color:var(--ink);font-family:Lalezar,Cairo,sans-serif;font-size:21px;min-width:46px;text-align:center;border-radius:999px;padding:0 10px;line-height:1.5}
footer{background:#00000055;border-top:2px solid var(--org);text-align:center;padding:24px 14px 32px}
footer a{color:var(--org);font-weight:700;text-decoration:none;direction:ltr;unicode-bidi:isolate;display:inline-block;margin:2px 8px;font-size:18px}
@media(max-width:480px){.it{align-items:flex-start;flex-direction:column;gap:4px}.pr span{font-size:19px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
